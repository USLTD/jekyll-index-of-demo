name: Deploy Jekyll site to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull the demonstration repository (your public/ mock folders)
      - name: Checkout demo content
        uses: actions/checkout@v4
        with:
          path: demo-repo

      # 2. Pull the core template logic in real-time (always fetches the latest commit)
      - name: Checkout core template logic
        uses: actions/checkout@v4
        with:
          repository: USLTD/jekyll-index-of
          path: template-repo

      # 3. Merge the template code into your demo environment workspace
      - name: Merge template structures with demo content
        run: |
          # Copy core configuration, scripts, layouts, and icons into the workspace root
          cp -r template-repo/_layouts/ ./
          cp -r template-repo/_includes/ ./
          cp -r template-repo/assets/ ./
          cp template-repo/generate-directory-listings.js ./
          cp template-repo/_config.yml ./
          cp template-repo/index.html ./
          
          # Move your demonstration assets folder to the workspace root
          cp -r demo-repo/public/ ./

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate directory listing data & pages
        run: node generate-directory-listings.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6. Build the static distribution site
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
